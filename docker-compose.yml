# Mukkani CRM on one server: database, app and the HTTPS front door.
# Start with:  bash deploy/install.sh crm.yourdomain.com
name: mukkani-crm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mukkani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/install.sh first to create the .env file}
      POSTGRES_DB: mukkani
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mukkani -d mukkani"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mukkani:${POSTGRES_PASSWORD}@db:5432/mukkani
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_URL: ${APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_TIMEZONE: Asia/Kolkata

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
